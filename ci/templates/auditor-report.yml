# Modelo para o REPOSITÓRIO-ALVO: .github/workflows/auditor-report.yml
#
# Comentário no PR SOMENTE a pedido de um humano (decisão 7 do revisor; princípio 8): um
# comentário cuja primeira linha começa com `@auditor report`, de alguém com acesso ao
# repositório (OWNER, MEMBER, COLLABORATOR). Publica o sumário da última auditoria do commit
# atual do PR. Não faz checkout nem executa código do PR. Actions fixadas por SHA (D-25).
name: auditor-report

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@auditor report') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04   # fixado (D-55): ubuntu-latest migra para Ubuntu 26 desde 2026-10-19
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: instalar o auditor (ref fixada; código confiável)
        run: python -m pip install "git+https://github.com/OWNER/auditor@AUDITOR_SHA"

      - name: publicar o sumário pedido
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          head=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          run_id=$(gh run list --repo "$REPO" --workflow auditor-tier1.yml --commit "$head" --limit 1 \
                     --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            gh pr comment "$PR" --repo "$REPO" --body "auditor: nenhuma execução para o commit \`$head\`."
            exit 0
          fi
          if ! gh run download "$run_id" --repo "$REPO" --name auditor-report --dir rep; then
            gh pr comment "$PR" --repo "$REPO" --body "auditor: execução $run_id sem relatório (falha de infraestrutura)."
            exit 0
          fi
          auditor-ci comment --summary rep/summary.md --head-sha "$head" --output body.md
          gh pr comment "$PR" --repo "$REPO" --body-file body.md
