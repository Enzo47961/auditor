# Classificação de risco dos comandos do Lean para a Etapa A.
# A LISTA de comandos é extraída mecanicamente do toolchain (Dump.lean).
# Apenas a CLASSIFICAÇÃO abaixo é mantida à mão. Comando extraído que não
# aparece aqui cai em `allowed`.
#
# Critério (fail-closed quando presente no arquivo-alvo):
#   syntax_extension — introduz sintaxe que a Etapa A não consegue ler.
#   metaprogramming  — executa código arbitrário durante a elaboração capaz de
#                      alterar o ambiente ou extensões; OU é comando interno do
#                      core (builtin_*, init_*) cujo uso fora do core é exótico;
#                      OU oculta conteúdo da elaboração (#exit);
#                      OU pode executar código compilado em tempo de elaboração,
#                      antes que a Etapa B possa inspecionar o ambiente
#                      (critério do revisor, Q8; limitations.md L-17). Por ele:
#                      #eval, #reduce, #guard, #widget, #guard_expr, #check_tactic,
#                      #check_tactic_failure → fail-closed; #check, #synth,
#                      #check_simp → allowed (revisados: não executam código compilado).
#                      OU envolve outro comando de forma que ele escape da checagem de
#                      coluna 0 da allow-list (with_weak_namespace: o comando envolvido
#                      fica indentado, por exigência do parser).
# Na dúvida, classificar como fail-closed (assimetria de erro).
#
# Revisão da subida para v4.36.0-rc1 (40 comandos novos; D-40). Ficaram em `allowed`, por
# não executarem código e terem efeito visível à Etapa B ou nenhum: #check_assertions,
# #import_path, #show_deprecated_modules (só leem o ambiente); assert_not_exists,
# assert_not_imported, deprecated_module, deprecated_syntax, grind_annotated (metadados);
# coinductive (declaração, como inductive); recall (só confere declaração existente);
# unlock_limits (a Etapa A o registra como os três `set_option … 0` que ele aplica, e a
# política de set_option decide; D-41). Os demais novos estão abaixo.
# Fase 1, L-33 (instrução 24): `show_panel_widgets` saiu de `allowed`. Ele avalia, com `evalModule` e
# `evalWidgetInstance`, termos escritos no arquivo (Lean/Widget/Commands.lean:62–75; UserWidget.lean:20–29),
# como o `#widget` que já era fail-closed. Inventário em docs/l33-inventory.md.
classification_version = "5"

syntax_extension = [
  "binder_predicate", "declare_syntax_cat", "declare_simp_like_tactic", "elab", "elab_rules",
  "infix", "infixl", "infixr", "macro", "macro_rules", "notation", "postfix", "prefix",
  "syntax", "?", "«$»",
]

metaprogramming = [
  "show_panel_widgets",   # L-33: avalia termos do arquivo (Widget/Commands.lean:70–75)
  "#eval", "#eval!", "#exit", "#with_exporting", "#dump_async_env_state",
  "#reduce", "#guard", "#widget", "#guard_expr", "#check_tactic", "#check_tactic_failure",
  "builtin_dsimproc", "builtin_dsimproc_decl", "builtin_grind_propagator", "builtin_initialize",
  "builtin_simproc", "builtin_simproc_decl", "«builtin_simproc_pattern%»",
  "declare_bitwise_int_theorems", "declare_bitwise_uint_theorems", "declare_command_config_elab",
  "declare_config_elab", "declare_int_theorems", "declare_sint_simprocs", "declare_uint_simprocs",
  "declare_uint_theorems", "dsimproc", "dsimproc_decl", "elab_stx_quot", "«gen_injective_theorems%»",
  "grind_propagator", "init_grind_norm", "init_quot", "initialize", "register_builtin_option",
  "register_label_attr", "register_linter_set", "register_option", "register_simp_attr",
  "register_tactic_tag", "«reset_grind_attrs%»", "run_cmd", "run_elab", "run_meta", "simproc",
  "simproc_decl", "«simproc_pattern%»", "tactic_extension", "test_extern",
  # novos em v4.36.0-rc1 (D-40)
  "#guard_panic", "#grind_lint", "reprove", "with_weak_namespace", "docs_to_verso",
  "builtin_cbv_simproc", "builtin_cbv_simproc_decl", "«builtin_cbv_simproc_pattern%»",
  "cbv_simproc", "cbv_simproc_decl", "«cbv_simproc_pattern%»",
  "declare_command_config_elab_legacy", "declare_config_elab_legacy", "declare_core_config_elab",
  "declare_term_config_elab", "def_eval_config_item",
  "declare_decidable_int_quantifiers", "declare_decidable_uint_quantifiers",
  "declare_eval_bin", "declare_eval_bin_bitwise", "declare_eval_bin_bool_pred",
  "register_error_explanation", "register_grind_attr", "register_sym_dsimp", "register_sym_simp",
  "register_sym_simp_attr", "register_try?_tactic", "set_library_suggestions",
]

# Tokens que não são comandos mas aparecem legitimamente na coluna 0 como
# continuação de um comando (casamento de padrões, cláusulas). Mantido à mão.
# Nenhum pode ser token inicial de comando: o gerador recusa (exit 2) se for, no core ou no
# projeto, e a Etapa A descarta o que o projeto tiver como comando. Fase 1, P0-2 (a): termos
# escritos na coluna 0 no Mathlib (`{ … with }`, `(…)`, `⟨…⟩`, `match`, `let`, `f!"…"`,
# `docs/p0-2-fail-closed.md`) e as palavras de termo da lista do revisor (instrução 24).
continuation = ["|", "where", "termination_by", "decreasing_by", "with", ")", "]", "}", "⟩",
  "{", "(", "⟨", "[",
  "match", "do", "let", "have", "show", "from", "by", "fun", "if", "then", "else", "for", "calc",
  "f!", "s!", "m!"]

# Segundo token de comando cujo primeiro token é OBRIGATORIAMENTE uma docstring: aceito na
# coluna 0 só logo depois de `/--`. `add_decl_doc`: `docComment >> "add_decl_doc " >> ident`
# (Lean/Parser/Command.lean:939, v4.36.0-rc1). Como `continuation`, nunca token inicial.
doc_continuation = ["add_decl_doc"]
