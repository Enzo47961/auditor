[project]
name = "auditor"
version = "0.0.1"
description = "Verificador mecânico de integridade de provas Lean 4 — Fase 0, Tier 1"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
auditor = "auditor.__main__:main"
auditor-gen-allowlist = "auditor.allowlist:main"
auditor-ci = "auditor.ci:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditor = ["data/**/*", "lean/*.lean", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
