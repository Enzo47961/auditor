# auditor-tier1 — workflow reutilizável (componente 7). O repositório-alvo (ex.: fork do
# Mathlib) o chama em `pull_request`; modelo em ci/templates/auditor-tier1.yml.
#
# Segurança (D-24): este job roda código do PR (`lake build`), portanto tem SÓ permissão de
# leitura. Ele não aplica label nem comenta: o label é aplicado por um workflow separado e
# confiável (ci/templates/auditor-label.yml), que nunca executa código do PR; o comentário só
# sai quando um humano pede (`@auditor report`, ci/templates/auditor-report.yml).
#
# Orçamento (instrução 11, D-28): wall-clock do PR, do trigger até o relatório, INCLUINDO a
# preparação (`lake exe cache get`). 5 min no steady-state; cache cold → orçamento estendido e
# `first_run`. Timeout por arquivo (D-21): 90 s; estourá-lo encerra a auditoria do PR (exit 2).
# Infraestrutura (exit 2) → o job NÃO falha (não bloqueia merge) e o workflow de label marca o
# PR. Rejeição real → o job falha (D-22).
#
# Toda action é fixada por SHA de commit (D-25; docs/maintenance.md). O elan é baixado da
# release fixada e conferido por SHA-256 (o elan-init.sh baixaria a release `latest`).
name: auditor-tier1

on:
  workflow_call:
    inputs:
      auditor-repository:
        description: "owner/repo do auditor"
        type: string
        required: true
      auditor-ref:
        description: "commit (SHA) fixado do auditor — nunca um branch"
        type: string
        required: true
      policy:
        description: "caminho da política no repositório-alvo; vazio = política default do auditor"
        type: string
        default: ""
      timeout-total-seconds:
        description: "wall-clock total do PR no steady-state (s), do trigger ao relatório; spec: 300"
        type: number
        default: 300
      timeout-total-first-run-seconds:
        description: "wall-clock total do PR com cache cold (s)"
        type: number
        default: 900
      timeout-file-seconds:
        description: "timeout por arquivo (s); reajustar pelo p95 medido"
        type: number
        default: 90
      cache-get:
        description: "rodar `lake exe cache get` antes (Mathlib), com cache de ~/.cache/mathlib"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04   # fixado (D-55): ubuntu-latest migra para Ubuntu 26 desde 2026-10-19
    timeout-minutes: 45        # salvaguarda; o orçamento real é aplicado pelo auditor-ci
    permissions:
      contents: read
    steps:
      - name: início do job
        id: clock
        run: echo "job_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: checkout do PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: arquivos .lean alterados
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.lean' > "$RUNNER_TEMP/files.txt"
          echo "arquivos .lean tocados: $(wc -l < "$RUNNER_TEMP/files.txt")"

      - name: checkout do auditor (ref fixada)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.auditor-repository }}
          ref: ${{ inputs.auditor-ref }}
          path: .auditor-tool
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # D-62: o auditor sai do workspace depois de instalado. Dentro dele, o checkout contava como
      # arquivo não rastreado e todo relatório saía com `project_dirty: true`.
      - name: instalar o auditor (e tirá-lo do workspace, D-62)
        run: |
          python -m pip install ./.auditor-tool
          mv .auditor-tool "$RUNNER_TEMP/auditor-tool"

      - name: instalar elan (release fixada, SHA-256 conferido)
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/elan.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # A2 (instrução 20): restaurar e salvar em passos separados. O `actions/cache` só salva com o
      # job verde, e um PR que sai `unresolved` (resultado correto) nunca aquecia o próprio cache.
      - name: cache do inspetor (restaurar, D-7)
        id: inspector-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/auditor
          key: auditor-inspector-${{ runner.os }}-${{ inputs.auditor-ref }}-${{ hashFiles('lean-toolchain') }}

      - name: cache do Mathlib (restaurar)
        id: mathlib-cache
        if: inputs.cache-get
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mathlib
          key: mathlib-cache-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            mathlib-cache-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: cache de build do Mathlib
        if: inputs.cache-get
        run: lake exe cache get

      - name: cache do Mathlib (salvar)
        if: inputs.cache-get && steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mathlib
          key: mathlib-cache-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.event.pull_request.base.sha }}

      - name: auditar
        id: audit
        timeout-minutes: 30
        env:
          POLICY_INPUT: ${{ inputs.policy }}
          TIMEOUT_TOTAL: ${{ inputs.timeout-total-seconds }}
          TIMEOUT_TOTAL_FIRST_RUN: ${{ inputs.timeout-total-first-run-seconds }}
          TIMEOUT_FILE: ${{ inputs.timeout-file-seconds }}
          CACHE_GET: ${{ inputs.cache-get }}
          CACHE_HIT: ${{ steps.mathlib-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.mathlib-cache.outputs.cache-matched-key }}
          TRIGGER_AT: ${{ github.event.pull_request.updated_at }}
          JOB_START: ${{ steps.clock.outputs.job_start }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          policy="${POLICY_INPUT:-$RUNNER_TEMP/auditor-tool/policy.toml}"
          if [ "$CACHE_GET" != "true" ]; then build_cache=none
          elif [ "$CACHE_HIT" = "true" ]; then build_cache=hit
          elif [ -n "$CACHE_MATCHED" ]; then build_cache=partial
          else build_cache=miss; fi
          # relógio do PR: o trigger (evento do PR); numa re-execução, o início do job
          if [ "$RUN_ATTEMPT" = "1" ] && [ -n "$TRIGGER_AT" ]; then start="$TRIGGER_AT"; kind=trigger
          else start="$JOB_START"; kind=job_start; fi
          rc=0
          auditor-ci run --files-from "$RUNNER_TEMP/files.txt" --policy "$policy" \
            --out-dir "$RUNNER_TEMP/auditor-out" --timeout-total "$TIMEOUT_TOTAL" \
            --timeout-total-first-run "$TIMEOUT_TOTAL_FIRST_RUN" --timeout-file "$TIMEOUT_FILE" \
            --build-cache "$build_cache" --started-at "$start" --started-at-kind "$kind" \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" || rc=$?
          # 0 ok · 1 rejeição (o passo seguinte falha o job) · 2 infraestrutura (label, não bloqueia)
          echo "auditor-ci run: exit $rc"

      - name: inspetor pronto? (A2)
        id: inspector-ready
        if: always() && steps.inspector-cache.outputs.cache-hit != 'true'
        run: auditor-ci inspector --project . --check --github-output "$GITHUB_OUTPUT"

      - name: cache do inspetor (salvar, A2)
        if: always() && steps.inspector-cache.outputs.cache-hit != 'true' && steps.inspector-ready.outputs.built == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/auditor
          key: auditor-inspector-${{ runner.os }}-${{ inputs.auditor-ref }}-${{ hashFiles('lean-toolchain') }}

      - name: rejeição falha o job (D-22)
        if: steps.audit.outputs.audit_failed == 'true'
        run: |
          echo "::error::o auditor rejeitou ou não resolveu declarações; ver o Job Summary"
          exit 1

      - name: medição do cache (D-7, D-28)
        if: always()
        env:
          MATHLIB_HIT: ${{ steps.mathlib-cache.outputs.cache-hit }}
          MATHLIB_MATCHED: ${{ steps.mathlib-cache.outputs.cache-matched-key }}
          STATE: ${{ steps.audit.outputs.cache_state }}
        run: |
          {
            echo "cache_state: ${STATE:-desconhecido}"
            echo "cache do Mathlib: exato=${MATHLIB_HIT:-false} parcial=${MATHLIB_MATCHED:-nenhum}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: artefato com os relatórios completos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditor-report
          path: ${{ runner.temp }}/auditor-out
          if-no-files-found: warn
