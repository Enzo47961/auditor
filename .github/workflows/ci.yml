# CI do próprio auditor: a suíte inteira (conformance, fail-closed, unidades, ground truth,
# defasagem da allow-list, verificação sem LLM) roda em todo push e PR deste repositório.
# Actions fixadas por SHA de commit (D-25; docs/maintenance.md).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: instalar o auditor com dependências de teste
        run: python -m pip install -e ".[test]"

      - name: instalar elan (release fixada, SHA-256 conferido; o toolchain vem de lean-toolchain)
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/elan.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: cache do inspetor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/auditor
          key: auditor-inspector-${{ runner.os }}-${{ hashFiles('src/auditor/lean/Inspect.lean', 'lean-toolchain') }}

      - name: suíte
        run: python -m pytest -q
