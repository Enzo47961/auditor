# CI do próprio auditor: a suíte inteira (conformance, fail-closed, unidades, ground truth,
# defasagem da allow-list, verificação sem LLM) roda em todo push e PR deste repositório.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar o auditor com dependências de teste
        run: python -m pip install -e ".[test]"

      - name: instalar elan (versão fixada) e o toolchain de lean-toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: cache do inspetor
        uses: actions/cache@v4
        with:
          path: ~/.cache/auditor
          key: auditor-inspector-${{ runner.os }}-${{ hashFiles('src/auditor/lean/Inspect.lean', 'lean-toolchain') }}

      - name: suíte
        run: python -m pytest -q
